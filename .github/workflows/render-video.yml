name: Render THPT Quang Trung anniversary video

on:
  workflow_dispatch:
    inputs:
      phep_mau_start:
        description: "Start time in seconds for the Phép Màu chorus segment"
        required: true
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video dependencies
        run: python -m pip install --upgrade pip pillow moviepy librosa imageio-ffmpeg

      - name: Verify bundled FFmpeg
        run: |
          python - <<'PY'
          import imageio_ffmpeg
          import subprocess
          executable = imageio_ffmpeg.get_ffmpeg_exe()
          print("FFmpeg:", executable)
          subprocess.run([executable, "-version"], check=True, stdout=subprocess.DEVNULL)
          PY

      - name: Check required inputs
        run: |
          if [ ! -f source/photos.zip ] && ! find source -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | grep -q .; then echo "Missing photos: upload source/photos.zip or the extracted images directly into source/."; exit 1; fi
          find music -maxdepth 1 -type f -iname '*.mp3' -print
          test "$(find music -maxdepth 1 -type f -iname '*.mp3' | wc -l)" -ge 3 || (echo "Expected all three MP3 files in music/."; exit 1)

      - name: Render MP4
        env:
          PHEP_MAU_START: ${{ inputs.phep_mau_start }}
        run: python scripts/build_video.py

      - name: Verify rendered file
        run: |
          test -s output/thpt-quang-trung-30-nam.mp4
          python - <<'PY'
          import os
          from moviepy import VideoFileClip
          path = "output/thpt-quang-trung-30-nam.mp4"
          with VideoFileClip(path) as clip:
              print(f"Duration: {clip.duration:.2f}s; size: {os.path.getsize(path)} bytes")
              assert 470 <= clip.duration <= 490, "Unexpected video duration"
          PY

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: thpt-quang-trung-30-nam-mp4
          path: output/thpt-quang-trung-30-nam.mp4
          if-no-files-found: error
          retention-days: 7
